name: Refresh dates and deploy

# Every morning: read every feed, rebuild the site, publish to GitHub Pages.
# Also runs on every push to main, so a new author shows up within minutes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * *" # about 6:23 AM New York in winter, 7:23 AM in summer
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INDEX: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Language gate and data check
        run: npm run gate

      - name: Read every feed
        run: node scripts/fetch-events.mjs

      - name: Build the site
        run: node scripts/build.mjs

      - name: Check share card and search text
        run: node scripts/check-preview.mjs

      # A dated record of each morning's dates, and the memory of what has been
      # seen, which is what orders the RSS feed. Only on the schedule and manual
      # runs, so a push is not followed by a bot commit to pull.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "authors-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/seen.json data/pages.json
          if ! git diff --cached --quiet; then
            git commit -m "data: dates for $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
